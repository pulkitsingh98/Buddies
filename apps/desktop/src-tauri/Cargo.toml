[package]
name = "deskpals"
version = "0.1.0"
description = "Photo-to-desktop-pet app"
edition = "2021"
rust-version = "1.85"

[lib]
name = "deskpals_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-single-instance = "2.5"
tauri-plugin-updater = "2.14"
tauri-plugin-process = "2.4"
tauri-plugin-log = "2.10"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Shares the TLS stack the updater plugin already enables (rustls); no extra TLS dependency.
reqwest = { version = "0.13", default-features = false, features = ["stream"] }
futures-util = "0.3"
# reqwest is built without a crypto provider (as the updater does); we install ring at startup.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "io-util"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_SystemInformation",
  "Win32_UI_Shell",
] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
